name: Build Openclaw Docker Images

on:
  schedule:
    # Check for new stable and prerelease OpenClaw releases every hour
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenClaw version to build (e.g., 2026.7.1 or 2026.7.2-beta.3). Leave empty to build the latest stable and beta.'
        required: false
        type: string
      force_rebuild:
        description: 'Force rebuild even if the image already exists'
        required: false
        type: boolean
        default: false
      skip_latest_tag:
        description: 'Skip tagging a stable release as latest (prereleases never update latest)'
        required: false
        type: boolean
        default: false

env:
  GITHUB_REGISTRY: ghcr.io
  DOCKER_REGISTRY: docker.io
  IMAGE_NAME: coollabsio/openclaw
  BASE_IMAGE_NAME: coollabsio/openclaw-base

jobs:
  check-releases:
    runs-on: ubuntu-24.04
    outputs:
      releases: ${{ steps.release-candidates.outputs.releases }}
      missing_releases: ${{ steps.check-images.outputs.missing_releases }}
      should_build: ${{ steps.check-images.outputs.should_build }}
    steps:
      - uses: actions/checkout@v5

      - name: Select OpenClaw releases
        id: release-candidates
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          API_URL="https://api.github.com/repos/openclaw/openclaw"
          OUTPUT_FILE="${RUNNER_TEMP}/release-candidates.json"
          CURL_ARGS=(
            --fail
            --silent
            --show-error
            --location
            --header "Accept: application/vnd.github+json"
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )

          if [ -n "$REQUESTED_VERSION" ]; then
            VERSION="${REQUESTED_VERSION#v}"
            if [[ ! "$VERSION" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "Invalid OpenClaw version: $REQUESTED_VERSION" >&2
              exit 1
            fi

            curl "${CURL_ARGS[@]}" \
              "${API_URL}/releases/tags/v${VERSION}" \
              | node scripts/release-candidates.js --requested "$VERSION" \
              > "$OUTPUT_FILE"
          else
            LATEST_STABLE_FILE="${RUNNER_TEMP}/latest-stable.json"
            RECENT_RELEASES_FILE="${RUNNER_TEMP}/recent-releases.json"

            curl "${CURL_ARGS[@]}" \
              "${API_URL}/releases/latest" \
              > "$LATEST_STABLE_FILE"
            curl "${CURL_ARGS[@]}" \
              "${API_URL}/releases?per_page=100" \
              > "$RECENT_RELEASES_FILE"

            jq -s '[.[0]] + .[1]' \
              "$LATEST_STABLE_FILE" \
              "$RECENT_RELEASES_FILE" \
              | node scripts/release-candidates.js \
              > "$OUTPUT_FILE"
          fi

          RELEASES=$(jq -c . "$OUTPUT_FILE")
          if [ "$RELEASES" = "[]" ]; then
            echo "No published OpenClaw releases found" >&2
            exit 1
          fi

          echo "Selected releases: $RELEASES"
          echo "releases=$RELEASES" >> "$GITHUB_OUTPUT"

      - name: Check which images need building
        id: check-images
        env:
          RELEASES: ${{ steps.release-candidates.outputs.releases }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          set -euo pipefail

          GHCR_IMAGE="${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}"
          MISSING_RELEASES='[]'

          while IFS= read -r RELEASE; do
            VERSION=$(jq -r '.version' <<< "$RELEASE")

            if [ "$FORCE_REBUILD" = "true" ]; then
              echo "Force rebuild enabled for $VERSION"
              MISSING_RELEASES=$(jq -c \
                --argjson release "$RELEASE" \
                '. + [$release]' \
                <<< "$MISSING_RELEASES")
            elif docker manifest inspect "${GHCR_IMAGE}:${VERSION}" > /dev/null 2>&1; then
              echo "Image ${GHCR_IMAGE}:${VERSION} already exists"
            else
              echo "Image ${GHCR_IMAGE}:${VERSION} does not exist; it will be built"
              MISSING_RELEASES=$(jq -c \
                --argjson release "$RELEASE" \
                '. + [$release]' \
                <<< "$MISSING_RELEASES")
            fi
          done < <(jq -c '.[]' <<< "$RELEASES")

          echo "missing_releases=$MISSING_RELEASES" >> "$GITHUB_OUTPUT"
          if [ "$MISSING_RELEASES" = "[]" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-base:
    needs: check-releases
    if: needs.check-releases.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.check-releases.outputs.missing_releases) }}
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to ${{ env.DOCKER_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push base image (${{ matrix.release.version }}-${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.base
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: |
            OPENCLAW_GIT_REF=v${{ matrix.release.version }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${{ matrix.release.version }}-${{ matrix.arch }}
            ${{ env.GITHUB_REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${{ matrix.release.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=base-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.arch }}

  merge-base-manifest:
    needs: [check-releases, build-base]
    if: needs.check-releases.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.check-releases.outputs.missing_releases) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to ${{ env.DOCKER_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and publish base manifest on ${{ env.GITHUB_REGISTRY }}
        env:
          VERSION: ${{ matrix.release.version }}
          IS_PRERELEASE: ${{ matrix.release.prerelease }}
          SKIP_LATEST_TAG: ${{ inputs.skip_latest_tag }}
        run: |
          BASE="${{ env.GITHUB_REGISTRY }}/${{ env.BASE_IMAGE_NAME }}"
          TAGS=(-t "${BASE}:${VERSION}")

          if [ "$IS_PRERELEASE" != "true" ] && [ "$SKIP_LATEST_TAG" != "true" ]; then
            TAGS+=(-t "${BASE}:latest")
          fi

          docker buildx imagetools create \
            "${TAGS[@]}" \
            "${BASE}:${VERSION}-amd64" \
            "${BASE}:${VERSION}-arm64"

      - name: Create and publish base manifest on ${{ env.DOCKER_REGISTRY }}
        env:
          VERSION: ${{ matrix.release.version }}
          IS_PRERELEASE: ${{ matrix.release.prerelease }}
          SKIP_LATEST_TAG: ${{ inputs.skip_latest_tag }}
        run: |
          BASE="${{ env.DOCKER_REGISTRY }}/${{ env.BASE_IMAGE_NAME }}"
          TAGS=(-t "${BASE}:${VERSION}")

          if [ "$IS_PRERELEASE" != "true" ] && [ "$SKIP_LATEST_TAG" != "true" ]; then
            TAGS+=(-t "${BASE}:latest")
          fi

          docker buildx imagetools create \
            "${TAGS[@]}" \
            "${BASE}:${VERSION}-amd64" \
            "${BASE}:${VERSION}-arm64"

  build-final:
    needs: [check-releases, merge-base-manifest]
    if: needs.check-releases.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.check-releases.outputs.missing_releases) }}
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to ${{ env.DOCKER_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push final image (${{ matrix.release.version }}-${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: |
            BASE_IMAGE=${{ env.GITHUB_REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${{ matrix.release.version }}-${{ matrix.arch }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.release.version }}-${{ matrix.arch }}
            ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.release.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=final-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=final-${{ matrix.arch }}

  merge-final-manifest:
    needs: [check-releases, build-final]
    if: needs.check-releases.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.check-releases.outputs.missing_releases) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to ${{ env.DOCKER_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and publish final manifest on ${{ env.GITHUB_REGISTRY }}
        env:
          VERSION: ${{ matrix.release.version }}
          IS_PRERELEASE: ${{ matrix.release.prerelease }}
          SKIP_LATEST_TAG: ${{ inputs.skip_latest_tag }}
        run: |
          IMAGE="${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAGS=(-t "${IMAGE}:${VERSION}")

          if [ "$IS_PRERELEASE" != "true" ] && [ "$SKIP_LATEST_TAG" != "true" ]; then
            TAGS+=(-t "${IMAGE}:latest")
          fi

          docker buildx imagetools create \
            "${TAGS[@]}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

      - name: Create and publish final manifest on ${{ env.DOCKER_REGISTRY }}
        env:
          VERSION: ${{ matrix.release.version }}
          IS_PRERELEASE: ${{ matrix.release.prerelease }}
          SKIP_LATEST_TAG: ${{ inputs.skip_latest_tag }}
        run: |
          IMAGE="${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAGS=(-t "${IMAGE}:${VERSION}")

          if [ "$IS_PRERELEASE" != "true" ] && [ "$SKIP_LATEST_TAG" != "true" ]; then
            TAGS+=(-t "${IMAGE}:latest")
          fi

          docker buildx imagetools create \
            "${TAGS[@]}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

      - name: Summary
        env:
          VERSION: ${{ matrix.release.version }}
          IS_PRERELEASE: ${{ matrix.release.prerelease }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            CHANNEL="prerelease"
          else
            CHANNEL="stable"
          fi

          {
            echo "## OpenClaw ${VERSION}"
            echo ""
            echo "Release channel: **${CHANNEL}**"
            echo ""
            echo "Successfully built and published:"
            echo "- \`${{ env.GITHUB_REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${VERSION}\` (base)"
            echo "- \`${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}\` (final)"
            echo "- \`${{ env.DOCKER_REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${VERSION}\` (base)"
            echo "- \`${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}\` (final)"
          } >> "$GITHUB_STEP_SUMMARY"

# Chromium ignores --remote-debugging-address and binds DevTools to
# 127.0.0.1:9222 only. This server is on the container's network interfaces
# so other compose services can call http://browser:9223. Do not publish
# 9222 or 9223 on the host; CDP is full browser control.
#
# Chrome rejects a non-local Host header. Host localhost:9222 is what
# /json/version advertises. Clearing Origin avoids Chrome 111+ answering
# 403 to OpenClaw's websocket handshake (Origin: http://browser:9223).
map $http_upgrade $cdp_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 0.0.0.0:9223;

    access_log /var/log/nginx/cdp-access.log;
    error_log /var/log/nginx/cdp-error.log;

    location / {
        proxy_pass http://127.0.0.1:9222;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:9222;
        proxy_set_header Origin "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cdp_connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
